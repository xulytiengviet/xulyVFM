name: Deploy private Cloudflare GDAL backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-gdal-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      XULYVFM_BACKEND_TOKEN: ${{ secrets.XULYVFM_BACKEND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test "${#XULYVFM_BACKEND_TOKEN}" -ge 32 || { echo 'XULYVFM_BACKEND_TOKEN needs at least 32 characters'; exit 1; }
      - run: npm ci
      - run: npx wrangler deploy
      - name: Configure private backend credential
        run: printf '%s' "$XULYVFM_BACKEND_TOKEN" | npx wrangler secret put BACKEND_TOKEN
