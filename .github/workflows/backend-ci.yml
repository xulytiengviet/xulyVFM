name: Backend Go CI

on:
  push:
    branches: [main]
    paths:
      - "backend-go/**"
      - "cloudflare/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend-go/**"
      - "cloudflare/**"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: gofmt -w main.go
      - run: git diff --exit-code -- main.go
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath ./...
  worker-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy --dry-run
